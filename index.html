<!DOCTYPE html>
<html lang="sq">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Morina Group — Sistemi i Orëve</title>
<meta name="theme-color" content="#14181d" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icons/favicon.svg" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="description" content="Morina Group — sistemi i menaxhimit të orëve të punës." />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Morina Group" />
<meta name="format-detection" content="telephone=no" />
<meta name="color-scheme" content="light" />
<style>
:root{
  --bg:#eef0f3; --panel:#fff; --panel-2:#f7f8fa; --ink:#171a1f; --ink-soft:#3a3f47;
  --muted:#6b7280; --muted-2:#9aa1ab; --border:#e6e8ec; --border-strong:#d3d8de;
  --accent:#15754e; --accent-ink:#0f5638; --accent-2:#1aa06a; --accent-soft:#e7f2ec;
  --blue:#2563eb; --danger:#b42318; --danger-soft:#fdeceb; --warn:#b45309; --warn-soft:#fef4e6;
  --sidebar:#14181d; --sidebar-2:#1b2027; --sb-ink:#c7cdd6; --sb-dim:#828b98;
  --sh-sm:0 1px 2px rgba(16,24,40,.06); --sh:0 4px 14px rgba(16,24,40,.08);
  --sh-lg:0 18px 50px rgba(16,24,40,.16); --r:14px; --r-sm:10px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4{margin:0;font-weight:660;letter-spacing:-.01em}
a{color:var(--blue);text-decoration:none}
button{font-family:inherit}
::selection{background:var(--accent-soft)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.muted{color:var(--muted)} .hidden{display:none!important} .nowrap{white-space:nowrap}
.spacer{flex:1}

/* ---------- Animations ---------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@keyframes slideIn{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drawCheck{to{stroke-dashoffset:0}}
@keyframes scaleIn{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes barGrow{from{height:0!important}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.anim-up{animation:fadeUp .5s cubic-bezier(.2,.7,.2,1) both}
.stagger>*{animation:fadeUp .5s cubic-bezier(.2,.7,.2,1) both}
.stagger>*:nth-child(1){animation-delay:.03s}.stagger>*:nth-child(2){animation-delay:.08s}
.stagger>*:nth-child(3){animation-delay:.13s}.stagger>*:nth-child(4){animation-delay:.18s}
.stagger>*:nth-child(5){animation-delay:.23s}.stagger>*:nth-child(6){animation-delay:.28s}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001s!important;transition-duration:.001s!important}}

/* ---------- Layout ---------- */
.app{display:flex;min-height:100vh}
.sidebar{width:250px;flex-shrink:0;background:linear-gradient(180deg,var(--sidebar-2),var(--sidebar));color:var(--sb-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:11px;padding:20px 20px 14px}
.logo{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,var(--accent-2),var(--accent));display:grid;place-items:center;color:#fff;font-weight:800;flex-shrink:0;box-shadow:0 6px 16px rgba(21,117,78,.4);letter-spacing:-.5px}
.brand-name{font-size:15px;font-weight:700;color:#fff;line-height:1.15}
.brand-sub{font-size:11px;color:var(--sb-dim);letter-spacing:.02em}
.nav{padding:8px 12px;display:flex;flex-direction:column;gap:2px;flex:1;overflow-y:auto}
.nav-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--sb-dim);padding:14px 12px 6px}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--sb-ink);cursor:pointer;font-size:14px;font-weight:500;border:none;background:none;width:100%;text-align:left;position:relative;transition:background .16s,color .16s,transform .1s}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item:active{transform:scale(.98)}
.nav-item.active{background:rgba(26,160,106,.16);color:#fff}
.nav-item.active::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--accent-2)}
.nav-item svg{width:19px;height:19px;flex-shrink:0;opacity:.9}
.nav-foot{padding:12px;border-top:1px solid rgba(255,255,255,.07)}
.nav-user{display:flex;align-items:center;gap:10px;padding:6px 8px 12px}
.avatar{border-radius:50%;background:linear-gradient(135deg,var(--accent-2),var(--accent-ink));color:#fff;display:grid;place-items:center;font-weight:700;flex-shrink:0;width:36px;height:36px;font-size:13px}
.nav-user-name{font-size:13px;color:#fff;font-weight:600;line-height:1.2}
.nav-user-role{font-size:11px;color:var(--sb-dim)}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{min-height:64px;background:rgba(255,255,255,.85);backdrop-filter:saturate(180%) blur(8px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:10px 24px;position:sticky;top:0;z-index:20}
.topbar h1{font-size:19px}
.topbar .sub{font-size:12.5px;color:var(--muted)}
.content{padding:24px;max-width:1240px;width:100%;margin:0 auto}
.hamburger{display:none;background:none;border:none;cursor:pointer;padding:6px;border-radius:8px;color:var(--ink)}
.scrim{display:none}

/* ---------- Cards / stats ---------- */
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--sh-sm)}
.card-pad{padding:18px 20px}
.card-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
.card-head h3{font-size:15px}.card-head .sub{font-size:12px;color:var(--muted)}
.grid{display:grid;gap:16px}
.stats{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(185px,1fr))}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;box-shadow:var(--sh-sm);transition:transform .18s,box-shadow .18s;position:relative;overflow:hidden}
.stat:hover{transform:translateY(-3px);box-shadow:var(--sh)}
.stat::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:var(--accent-soft);opacity:.5}
.stat-label{font-size:12.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:9px;position:relative}
.stat-ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink)}
.stat-ic svg{width:18px;height:18px}
.stat-value{font-size:29px;font-weight:750;margin-top:12px;letter-spacing:-.02em;position:relative}
.stat-value .unit{font-size:15px;color:var(--muted);font-weight:600}
.stat-foot{font-size:12px;color:var(--muted-2);margin-top:3px;position:relative}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:var(--r-sm);font-size:14px;font-weight:600;border:1px solid transparent;cursor:pointer;white-space:nowrap;line-height:1;position:relative;overflow:hidden;transition:transform .1s,background .15s,border-color .15s,box-shadow .15s}
.btn:active{transform:scale(.97)}
.btn svg{width:17px;height:17px}
.btn-primary{background:linear-gradient(135deg,var(--accent-2),var(--accent));color:#fff;box-shadow:0 4px 12px rgba(21,117,78,.28)}
.btn-primary:hover{box-shadow:0 6px 18px rgba(21,117,78,.36)}
.btn-ghost{background:var(--panel);color:var(--ink-soft);border-color:var(--border-strong)}
.btn-ghost:hover{background:var(--panel-2)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover{background:#97180f}
.btn-danger-ghost{background:var(--panel);color:var(--danger);border-color:#f0c8c4}
.btn-danger-ghost:hover{background:var(--danger-soft)}
.btn-sm{padding:7px 12px;font-size:13px}
.btn-lg{padding:15px 22px;font-size:16px}
.btn-block{width:100%}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-link{background:none;border:none;color:var(--blue);cursor:pointer;font-weight:600;padding:4px;font-size:13.5px}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rip .6s linear;pointer-events:none}
@keyframes rip{to{transform:scale(3.2);opacity:0}}

/* ---------- Inputs ---------- */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:15px}
.field label{font-size:13px;font-weight:600;color:var(--ink-soft)}
.input,select.input,textarea.input{width:100%;padding:12px 13px;border:1px solid var(--border-strong);border-radius:var(--r-sm);font-size:15px;font-family:inherit;color:var(--ink);background:var(--panel);transition:border-color .15s,box-shadow .15s}
.input:focus,select.input:focus,textarea.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.input{resize:vertical;min-height:88px}
.row{display:grid;gap:14px;grid-template-columns:1fr 1fr}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar .input,.toolbar select.input{width:auto;padding:9px 12px;font-size:13.5px}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.search .input{padding-left:36px}

/* ---------- Table ---------- */
.table-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
table.tbl th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;padding:12px 16px;border-bottom:1px solid var(--border);white-space:nowrap}
table.tbl td{padding:14px 16px;border-bottom:1px solid var(--border);color:var(--ink-soft);vertical-align:middle}
table.tbl tr:last-child td{border-bottom:none}
table.tbl tbody tr{transition:background .12s}
table.tbl tbody tr:hover{background:var(--panel-2)}
table.tbl td.num,table.tbl th.num{text-align:right;font-variant-numeric:tabular-nums}
.t-strong{color:var(--ink);font-weight:600}.t-mono{font-variant-numeric:tabular-nums}
.cell-desc{max-width:300px;color:var(--muted)}

/* ---------- Badges ---------- */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px}
.badge-dot{width:6px;height:6px;border-radius:50%}
.badge-active{background:var(--accent-soft);color:var(--accent-ink)}.badge-active .badge-dot{background:var(--accent);animation:floaty 2s ease-in-out infinite}
.badge-inactive{background:#f1f2f4;color:var(--muted)}.badge-inactive .badge-dot{background:var(--muted-2)}

/* ---------- Misc ---------- */
.flex{display:flex}.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.gap8{gap:8px}.gap12{gap:12px}.mt16{margin-top:16px}.mb0{margin-bottom:0}
.empty{text-align:center;padding:50px 24px;color:var(--muted)}
.empty svg{width:44px;height:44px;color:var(--muted-2);margin-bottom:12px}
.empty h4{font-size:15px;color:var(--ink-soft);margin-bottom:4px}.empty p{font-size:13.5px;margin:0}
.skeleton{background:linear-gradient(90deg,#eceef1 25%,#f4f5f7 37%,#eceef1 63%);background-size:400% 100%;animation:shimmer 1.3s ease infinite;border-radius:8px}
.spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
.spinner-dark{border-color:var(--border-strong);border-top-color:var(--accent)}
.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-top:1px solid var(--border);font-size:13px;color:var(--muted);flex-wrap:wrap}
.pager-btns{display:flex;gap:6px}

/* ---------- Toast ---------- */
.toast-wrap{position:fixed;top:18px;right:18px;z-index:1000;display:flex;flex-direction:column;gap:10px;max-width:360px}
.toast{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--muted-2);border-radius:12px;box-shadow:var(--sh-lg);padding:13px 15px;display:flex;gap:11px;align-items:flex-start;animation:slideIn .28s cubic-bezier(.2,.7,.2,1);font-size:13.5px}
.toast.success{border-left-color:var(--accent)}.toast.error{border-left-color:var(--danger)}
.toast.info{border-left-color:var(--blue)}.toast.warning{border-left-color:var(--warn)}
.toast-ic{width:20px;height:20px;flex-shrink:0;margin-top:1px}
.toast.success .toast-ic{color:var(--accent)}.toast.error .toast-ic{color:var(--danger)}
.toast.info .toast-ic{color:var(--blue)}.toast.warning .toast-ic{color:var(--warn)}
.toast-body{flex:1;color:var(--ink-soft)}.toast-body strong{color:var(--ink);display:block;font-weight:600}

/* ---------- Modal ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(15,20,26,.55);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:900;padding:20px;animation:fadeIn .16s ease}
.modal{background:var(--panel);border-radius:18px;box-shadow:var(--sh-lg);width:100%;max-width:480px;max-height:90vh;overflow-y:auto;animation:pop .24s cubic-bezier(.2,.7,.2,1)}
.modal.wide{max-width:720px}
.modal-head{padding:22px 24px 0}.modal-head h3{font-size:19px}.modal-head p{color:var(--muted);font-size:13.5px;margin:6px 0 0}
.modal-body{padding:18px 24px}.modal-foot{padding:14px 24px 22px;display:flex;gap:10px;justify-content:flex-end}
.dl{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border);border-radius:12px;overflow:hidden;border:1px solid var(--border)}
.dl>div{background:var(--panel);padding:14px 16px}.dl dt{font-size:12px;color:var(--muted);margin-bottom:3px}
.dl dd{margin:0;font-size:15px;font-weight:600;color:var(--ink)}
.guide-step{display:flex;gap:14px;padding:13px 0;border-bottom:1px solid var(--border)}.guide-step:last-child{border-bottom:none}
.guide-num{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);font-weight:800;display:grid;place-items:center;flex-shrink:0}
.guide-step h4{font-size:14.5px;margin-bottom:2px}.guide-step p{margin:0;color:var(--muted);font-size:13.5px}
.guide-eg{color:var(--accent-ink);background:var(--accent-soft);padding:1px 7px;border-radius:6px;font-size:12.5px}

/* ---------- Feed / chart ---------- */
.feed-item{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}.feed-item:last-child{border-bottom:none}
.feed-ic{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent-ink);display:grid;place-items:center;flex-shrink:0}
.feed-ic svg{width:18px;height:18px}
.feed-main{flex:1;min-width:0}.feed-name{font-weight:600;font-size:13.5px;color:var(--ink)}
.feed-act{font-size:13px;color:var(--muted)}.feed-meta{font-size:12px;color:var(--muted-2);display:flex;gap:10px;margin-top:2px;align-items:center}
.feed-meta svg{width:13px;height:13px}.feed-meta span{display:inline-flex;align-items:center;gap:4px}
.feed-time{font-variant-numeric:tabular-nums;color:var(--ink-soft);font-weight:600;font-size:13px;white-space:nowrap}
.bars{display:flex;align-items:flex-end;gap:10px;height:170px;padding:10px 4px 0}
@media(max-width:700px){.bars{height:130px;gap:6px}.bar-col .bar-day{font-size:10px}.bar-val{font-size:10px}}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;justify-content:flex-end}
.bar{width:100%;max-width:44px;background:linear-gradient(180deg,var(--accent-2),var(--accent));border-radius:7px 7px 0 0;min-height:3px;animation:barGrow .7s cubic-bezier(.2,.7,.2,1) both;transition:filter .15s}
.bar:hover{filter:brightness(1.1)}
.bar-col .bar-val{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar-col .bar-day{font-size:11.5px;color:var(--muted)}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--accent-2);display:inline-block;box-shadow:0 0 0 0 rgba(26,160,106,.5);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(26,160,106,.5)}70%{box-shadow:0 0 0 8px rgba(26,160,106,0)}100%{box-shadow:0 0 0 0 rgba(26,160,106,0)}}

/* ---------- Worker hero ---------- */
.hero-action{display:block;width:100%;text-align:left;background:linear-gradient(135deg,var(--accent-2),var(--accent));color:#fff;border:none;border-radius:16px;padding:20px 22px;cursor:pointer;box-shadow:0 10px 26px rgba(21,117,78,.34);transition:transform .12s,box-shadow .18s;position:relative;overflow:hidden}
.hero-action:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(21,117,78,.42)}
.hero-action:active{transform:scale(.99)}
.hero-action .ha-top{display:flex;align-items:center;gap:13px;position:relative}
.hero-action .ha-ic{width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.2);display:grid;place-items:center}
.hero-action .ha-ic svg{width:25px;height:25px}
.hero-action .ha-title{font-size:18px;font-weight:720}.hero-action .ha-sub{font-size:13px;opacity:.9;margin-top:2px}
.status-pill{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;padding:7px 13px;border-radius:20px;background:var(--warn-soft);color:var(--warn)}
.status-pill.done{background:var(--accent-soft);color:var(--accent-ink)}
.calc-box{background:var(--accent-soft);border:1px solid #cfe5da;border-radius:12px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;transition:transform .2s}
.calc-box.bump{transform:scale(1.03)}
.calc-box .lbl{font-size:13px;color:var(--accent-ink);font-weight:600}
.calc-box .val{font-size:24px;font-weight:760;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.check-svg{width:56px;height:56px}
.check-svg circle{stroke:var(--accent);stroke-width:3;fill:none;stroke-dasharray:170;stroke-dashoffset:170;animation:drawCheck .5s ease forwards}
.check-svg path{stroke:var(--accent);stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:drawCheck .35s .35s ease forwards}

/* ---------- Mobile ---------- */
.mobile-nav{display:none}
@media(max-width:860px){
  .sidebar{position:fixed;left:0;top:0;z-index:60;transform:translateX(-100%);transition:transform .24s ease;box-shadow:var(--sh-lg)}
  .sidebar.open{transform:none}
  .scrim.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:55;animation:fadeIn .2s}
  .hamburger{display:inline-grid;place-items:center}
  .content{padding:16px;padding-bottom:86px}.topbar{padding:10px 16px}
  .row{grid-template-columns:1fr}.dl{grid-template-columns:1fr}
  .app.worker .sidebar{display:none}
  .mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;height:64px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-top:1px solid var(--border);z-index:50;padding:6px 4px;padding-bottom:max(6px,env(safe-area-inset-bottom))}
  .mobile-nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:10.5px;font-weight:600;border-radius:10px;cursor:pointer;transition:color .15s,transform .1s}
  .mobile-nav a:active{transform:scale(.9)}
  .mobile-nav a svg{width:22px;height:22px}
  .mobile-nav a.active{color:var(--accent)}
}
@media(min-width:861px){.mobile-nav{display:none!important}}

/* ---------- Login ---------- */
.login-wrap{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr}
.login-brand{background:radial-gradient(1000px 500px at -10% -10%,#1c3a2c 0%,transparent 60%),linear-gradient(160deg,#171c22,#14181d 60%,#0f3a28 220%);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.login-brand .glow{position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(26,160,106,.28),transparent 70%);bottom:-120px;right:-120px;animation:floaty 6s ease-in-out infinite}
.login-brand .lb-logo{display:flex;align-items:center;gap:13px;position:relative}
.login-brand .lb-logo .logo{width:46px;height:46px}

/* ---------------- Helpers ---------------- */
const $ = (s,r=document)=>r.querySelector(s);
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const initials = (f,l)=>((f||'')[0]||'').toUpperCase()+((l||'')[0]||'').toUpperCase();
const pad = n => String(n).padStart(2,'0');
const WD=['E Diel','E Hënë','E Martë','E Mërkurë','E Enjte','E Premte','E Shtunë'];
const MO=['Janar','Shkurt','Mars','Prill','Maj','Qershor','Korrik','Gusht','Shtator','Tetor','Nëntor','Dhjetor'];
function todayISO(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function nowHM(){const d=new Date();return `${pad(d.getHours())}:${pad(d.getMinutes())}`}
function isDate(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)}
function fmtDate(iso){if(!isDate(iso))return iso||'';const[y,m,d]=iso.split('-');return `${d}.${m}.${y}`}
function weekday(iso){return WD[new Date(iso+'T00:00:00').getDay()]||''}
function t2m(t){const m=/^(\d{1,2}):(\d{2})$/.exec(t||'');if(!m)return null;const h=+m[1],mi=+m[2];if(h>23||mi>59)return null;return h*60+mi}
function calcMin(s,e,b){const a=t2m(s),z=t2m(e);if(a==null||z==null)return null;return z-a-(+b||0)}
function fmtMin(x){x=Math.max(0,Math.round(+x||0));const h=Math.floor(x/60),m=x%60;return h===0?`${m}min`:(m===0?`${h}h`:`${h}h ${pad(m)}min`)}
function hash(s){let h=5381;s=String(s);for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return 'h'+h.toString(16)}
function debounce(fn,ms=300){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}}
function timeAgo(iso){const d=new Date(iso);const s=Math.floor((Date.now()-d)/1000);if(s<60)return 'tani';if(s<3600)return Math.floor(s/60)+' min më parë';if(s<86400)return Math.floor(s/3600)+' orë më parë';return fmtDate(iso.slice(0,10))}

/* ---------------- Cloud data layer (Supabase) ---------------- */
const SUPA_URL='https://mnobitznzsiupnubwvgd.supabase.co';
const SUPA_KEY='sb_publishable_HNsl5HWymDq7UQqM3MwQ7w_2hOt0Jyl';
const TKEY='mg_token', CACHE='mg_cache', OUTBOX='mg_outbox';
let DB={users:[],entries:[],activity:[],audit:[],settings:{company_name:'Morina Group'},demo:false};
let ME=null, TOKEN=null, POLL=null;
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}

async function rpc(fn,params){
  let res;
  try{
    res=await fetch(SUPA_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(params||{})});
  }catch(e){ throw {error:'Nuk u lidh dot me serverin.',network:true,status:0}; }
  let data=null; try{data=await res.json()}catch(e){}
  if(!res.ok) throw {error:(data&&(data.message||data.hint||data.error))||('Gabim ('+res.status+')'),status:res.status};
  if(data&&data.error) throw {error:data.error};
  return data;
}
function applySnapshot(s){
  DB.users=s.users||DB.users; DB.entries=s.entries||[]; DB.activity=s.activity||DB.activity||[];
  DB.audit=s.audit||DB.audit||[]; DB.settings=s.settings||DB.settings||{company_name:'Morina Group'};
  if(s.me) ME=s.me;
  lsSet(CACHE,s);
}
async function pull(){
  const s=await rpc('mg_pull',{p_token:TOKEN});
  if(s&&s.error==='auth'){ TOKEN=null; lsDel(TKEY); throw {error:'auth'}; }
  applySnapshot(s); return s;
}

/* ---------------- Auth ---------------- */
async function login(username,password){
  const r=await rpc('mg_login',{p_username:username,p_password:password});
  if(r&&r.error) return {err:r.error};
  TOKEN=r.token; lsSet(TKEY,TOKEN); ME=r.user; return {ok:true,user:r.user};
}
async function logout(){
  try{ if(TOKEN) await rpc('mg_logout',{p_token:TOKEN}); }catch(e){}
  stopPoll(); TOKEN=null; ME=null; lsDel(TKEY); lsDel(CACHE); location.hash=''; renderLogin();
}
function restore(){
  TOKEN=lsGet(TKEY);
  const c=lsGet(CACHE); if(c&&c.me){ applySnapshot(c); }
  return !!TOKEN;
}

/* ---------------- Offline outbox (regjistrimet e punëtorit) ---------------- */
function queueOffline(e){
  const box=lsGet(OUTBOX)||[]; box.push(e); lsSet(OUTBOX,box);
  DB.entries.unshift({id:'pending-'+Date.now(),user_id:ME.id,work_date:e.p_date,start_time:e.p_start,end_time:e.p_end,break_minutes:e.p_break,total_minutes:e.tot,location:e.p_location,description:e.p_desc,deleted_at:null,pending:true});
  lsSet(CACHE,{me:ME,settings:DB.settings,entries:DB.entries,users:DB.users,activity:DB.activity,audit:DB.audit});
}
async function flushOutbox(){
  const box=lsGet(OUTBOX)||[]; if(!box.length||!navigator.onLine||!TOKEN) return;
  const rest=[];
  for(const e of box){ try{ const r=await rpc('mg_add_entry',e.rpc); if(r&&r.error) rest.push(e); }catch(err){ rest.push(e); } }
  lsSet(OUTBOX,rest);
  if(rest.length<box.length){ try{ await pull(); render(); }catch(e){} }
}

/* ---------------- Polling (kohë reale për adminin) ---------------- */
function stopPoll(){ if(POLL){clearInterval(POLL);POLL=null;} }
function startPoll(){ stopPoll(); POLL=setInterval(async()=>{
  if(document.hidden||!navigator.onLine||!TOKEN) return;
  const sig=()=>JSON.stringify([DB.entries.length,DB.entries[0]&&DB.entries[0].id,DB.activity[0]&&DB.activity[0].id]);
  const before=sig();
  try{ await pull(); }catch(e){ return; }
  const route=(location.hash.replace(/^#\//,'')||'dashboard').split('?')[0];
  if(before!==sig() && ME&&ME.role==='admin' && route==='dashboard'){ renderAdmin('dashboard'); }
}, 12000); }

/* ---------------- UI: toast / modal / ripple ---------------- */
function toast(type,msg,title){
  const w=$('#toasts');const ic={success:I.check,error:I.x,info:I.info,warning:I.warn}[type]||I.info;
  const t=document.createElement('div');t.className='toast '+type;
  t.innerHTML=`<span class="toast-ic">${ic}</span><div class="toast-body">${title?`<strong>${esc(title)}</strong>`:''}${esc(msg)}</div>`;
  w.appendChild(t);setTimeout(()=>{t.style.transition='opacity .3s,transform .3s';t.style.opacity='0';t.style.transform='translateX(24px)';setTimeout(()=>t.remove(),300)},type==='error'?5000:3200);
}
function openModal(html,opts={}){
  const o=document.createElement('div');o.className='modal-overlay';
  o.innerHTML=`<div class="modal ${opts.wide?'wide':''}" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(o);document.body.style.overflow='hidden';
  const close=()=>{o.style.animation='fadeIn .12s reverse';setTimeout(()=>{o.remove();document.body.style.overflow=''},110);document.removeEventListener('keydown',k)};
  function k(e){if(e.key==='Escape'&&opts.dismissable!==false)close()}
  o.addEventListener('mousedown',e=>{if(e.target===o&&opts.dismissable!==false)close()});
  document.addEventListener('keydown',k);
  return{o,close,el:s=>o.querySelector(s)};
}
function confirmModal({title,message,confirmText='Po, vazhdo',cancelText='Anulo',danger=false}){
  return new Promise(res=>{const m=openModal(`<div class="modal-head"><h3>${esc(title)}</h3><p>${esc(message)}</p></div><div class="modal-foot"><button class="btn btn-ghost" data-x>${esc(cancelText)}</button><button class="btn ${danger?'btn-danger':'btn-primary'}" data-ok>${esc(confirmText)}</button></div>`);
  m.el('[data-x]').onclick=()=>{m.close();res(false)};m.el('[data-ok]').onclick=()=>{m.close();res(true)};m.el('[data-ok]').focus();});
}
document.addEventListener('click',e=>{const b=e.target.closest('.btn');if(!b)return;const r=document.createElement('span');r.className='ripple';const rect=b.getBoundingClientRect();const s=Math.max(rect.width,rect.height);r.style.width=r.style.height=s+'px';r.style.left=(e.clientX-rect.left-s/2)+'px';r.style.top=(e.clientY-rect.top-s/2)+'px';b.appendChild(r);setTimeout(()=>r.remove(),600)});

function animateNum(el,to,fmt,dur=850){const st=performance.now();const ease=p=>1-Math.pow(1-p,3);function step(t){const p=Math.min(1,(t-st)/dur);el.textContent=fmt(Math.round(ease(p)*to));if(p<1)requestAnimationFrame(step)}requestAnimationFrame(step)}
function runCounters(root){root.querySelectorAll('[data-count]').forEach(el=>{const to=+el.dataset.count;const kind=el.dataset.fmt;animateNum(el,to,kind==='min'?fmtMin:String)})}

function monthBounds(y,m){const last=new Date(y,m,0).getDate();return{s:`${y}-${pad(m)}-01`,e:`${y}-${pad(m)}-${pad(last)}`}}
function inR(e,a,b){return e.work_date>=a&&e.work_date<=b}
function sumMin(a){return a.reduce((s,e)=>s+e.total_minutes,0)}

function aDash(){
  topbar('Dashboard','Pasqyra e kompanisë');
  const today=todayISO();const[y,m]=today.split('-');const {s,e}=monthBounds(+y,+m);const act=activeEntries();
  const todayRows=act.filter(x=>x.work_date===today);const monthRows=act.filter(x=>inR(x,s,e));
  const days=[];for(let i=6;i>=0;i--){const d=new Date(today+'T00:00:00');d.setDate(d.getDate()-i);const iso=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;const mins=sumMin(act.filter(x=>x.work_date===iso));days.push({lbl:weekday(iso).replace('E ',''),mins,h:+(mins/60).toFixed(1)})}
  const maxB=Math.max(1,...days.map(d=>d.mins));
  const stat=(lbl,ic,to,fmt,val,foot)=>`<div class="stat"><div class="stat-label"><span class="stat-ic">${ic}</span> ${lbl}</div><div class="stat-value">${to!=null?`<span data-count="${to}" data-fmt="${fmt}">0</span>`:val}</div>${foot?`<div class="stat-foot">${foot}</div>`:''}</div>`;
  const feed=DB.activity.slice(0,12);
  setView(`
    <div class="stats stagger">
      ${stat('Punëtorë aktivë',I.users,workers().filter(w=>w.status==='active').length,'num','',`nga ${workers().length} gjithsej`)}
      ${stat('Orët sot',I.clock,sumMin(todayRows),'min','')}
      ${stat('Orët këtë muaj',I.report,sumMin(monthRows),'min','')}
      ${stat('Ditë pune (muaj)',I.cal,monthRows.length,'num','')}
      ${stat('Aktivë sot',I.activity,new Set(todayRows.map(x=>x.user_id)).size,'num','','punëtorë që regjistruan')}
    </div>
    <div class="grid mt16" style="grid-template-columns:1.4fr 1fr;gap:18px">
      <div class="card"><div class="card-head"><h3>Orët sipas ditëve</h3><span class="sub">7 ditët e fundit</span></div><div class="card-pad">${days.some(d=>d.mins)?`<div class="bars">${days.map((d,i)=>`<div class="bar-col"><span class="bar-val">${d.mins?d.h+'h':''}</span><div class="bar" style="height:${Math.max(3,Math.round(d.mins/maxB*100))}%;animation-delay:${i*.05}s"></div><span class="bar-day">${d.lbl}</span></div>`).join('')}</div>`:`<div class="empty" style="padding:26px 10px">${I.clock}<h4>Ende pa orë të regjistruara</h4><p>Sapo punëtorët të fillojnë të regjistrojnë ditët, grafiku mbushet vetë.</p></div>`}</div></div>
      <div class="card"><div class="card-head"><h3>Aktiviteti i fundit</h3><span class="sub" style="color:var(--accent)"><span class="live-dot"></span> live</span></div><div class="card-pad" style="max-height:360px;overflow-y:auto">${feed.length?feed.map(a=>`<div class="feed-item"><div class="feed-ic">${I.check}</div><div class="feed-main"><div class="feed-name">${esc(a.user_name)}</div><div class="feed-act">${esc(a.label)}</div><div class="feed-meta">${a.location?`<span>${I.pin} ${esc(a.location)}</span>`:''}<span>${esc(timeAgo(a.created_at))}</span></div></div><div class="feed-time">${esc(a.at_time||'')}</div></div>`).join(''):`<div class="empty">${I.activity}<h4>Ende pa aktivitet</h4><p>Kur punëtorët regjistrojnë, shfaqet këtu.</p></div>`}</div></div>
    </div>`);
}

function workerProfile(id){
  const w=DB.users.find(u=>u.id===id);if(!w)return;
  const today=todayISO();const[y,m]=today.split('-');const {s,e}=monthBounds(+y,+m);

function editEntry(id,after){

  };

function repHead(title,lines){return `<div class="rep-head"><div class="rep-co">${esc(DB.settings.company_name||'Morina Group')}</div><h2 class="rep-h2">${esc(title)}</h2>${lines.map(l=>`<div class="rep-sub">${l}</div>`).join('')}</div>`}

function repIndividual(uid,from,to){

function repMonthly(y,mo){
  const{s,e}=monthBounds(y,mo);const act=activeEntries();
  const rows=workers().map(w=>{const mine=act.filter(x=>x.user_id===w.id&&inR(x,s,e));return{name:w.first_name+' '+w.last_name,days:mine.length,mins:sumMin(mine)}}).sort((a,b)=>b.mins-a.mins);
  const total=rows.reduce((s,r)=>s+r.mins,0);
  $('#out').innerHTML=`<div class="flex gap8 no-print" style="justify-content:flex-end;margin-bottom:12px"><button class="btn btn-primary btn-sm" onclick="window.print()">${I.print} Printo</button></div><div class="card card-pad print-area">${repHead('Raport mujor i kompanisë',[`Periudha: <strong>${MO[mo-1]} ${y}</strong>`])}<div class="table-wrap"><table class="tbl rep-tbl"><thead><tr><th>Punëtori</th><th class="num">Ditë</th><th class="num">Orë</th></tr></thead><tbody>${rows.map(r=>`<tr><td class="t-strong">${esc(r.name)}</td><td class="num">${r.days}</td><td class="num t-strong">${fmtMin(r.mins)}</td></tr>`).join('')}</tbody><tfoot><tr><td style="font-weight:700">TOTALI I KOMPANISË</td><td></td><td class="num" style="font-weight:800;font-size:15px">${fmtMin(total)}</td></tr></tfoot></table></div>${repFoot()}</div>`;
}
function repYearly(y){
  const act=activeEntries();let total=0;const months=[];for(let m=1;m<=12;m++){const{s,e}=monthBounds(y,m);const mine=act.filter(x=>inR(x,s,e));const mins=sumMin(mine);total+=mins;months.push({n:MO[m-1],days:mine.length,mins})}
  $('#out').innerHTML=`<div class="flex gap8 no-print" style="justify-content:flex-end;margin-bottom:12px"><button class="btn btn-primary btn-sm" onclick="window.print()">${I.print} Printo</button></div><div class="card card-pad print-area">${repHead('Raport vjetor',[`Viti: <strong>${y}</strong>`])}<div class="table-wrap"><table class="tbl rep-tbl"><thead><tr><th>Muaji</th><th class="num">Ditë pune</th><th class="num">Orë</th></tr></thead><tbody>${months.map(r=>`<tr><td class="t-strong">${r.n}</td><td class="num">${r.days}</td><td class="num t-strong">${fmtMin(r.mins)}</td></tr>`).join('')}</tbody><tfoot><tr><td style="font-weight:700">TOTALI ${y}</td><td></td><td class="num" style="font-weight:800;font-size:15px">${fmtMin(total)}</td></tr></tfoot></table></div>${repFoot()}</div>`;
}
function downloadCSV(name,txt){const b=new Blob([txt],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

      <div class="field"><label>Fjalëkalimi aktual (për konfirmim)</label><input class="input" type="password" id="apw" autocomplete="current-password"></div>
      <button class="btn btn-primary" type="submit">Ruaj llogarinë</button></form></div>
    <div class="card card-pad"><h3 style="font-size:15px;margin-bottom:4px">Siguria</h3><p class="muted" style="font-size:13.5px;margin:0 0 14px">Ndrysho fjalëkalimin tënd.</p><button class="btn btn-ghost" id="cpw">${I.key} Ndrysho fjalëkalimin</button></div>
    ${installCardHtml()}
    ${DB.demo?`<div class="card card-pad"><h3 style="font-size:15px;margin-bottom:4px">Të dhënat demo</h3><p class="muted" style="font-size:13.5px;margin:0 0 14px">Ky version ka të dhëna shembull për ta parë sistemin. Fshiji për të nisur nga zeroja.</p><button class="btn btn-danger-ghost" id="clr">${I.trash} Pastro të dhënat demo</button></div>`:''}</div>`);
  $('#sf').onsubmit=async e=>{e.preventDefault();try{const r=await rpc('mg_update_settings',{p_token:TOKEN,p_name:$('#cn').value.trim(),p_address:$('#ca').value.trim(),p_email:$('#ce').value.trim(),p_phone:$('#cp').value.trim()});if(r&&r.error)throw{error:r.error};await pull();toast('success','Cilësimet u ruajtën.');buildChrome('admin');setActive('cilesimet')}catch(err){toast('error',(err&&err.error)||'Gabim.')}};
  $('#cpw').onclick=changePassword;
  wireInstall();
  $('#af').onsubmit=async e=>{e.preventDefault();
    const fn=$('#afn').value.trim(),ln=$('#aln').value.trim(),un=$('#aun').value.trim().toLowerCase(),pw=$('#apw').value;
    if(!fn||!ln){toast('warning','Shkruaj emrin dhe mbiemrin.');return}
    if(!/^[a-z0-9][a-z0-9._-]{2,29}$/.test(un)){toast('warning','Emri i përdoruesit: 3-30 karaktere, vetëm shkronja të vogla, numra, pikë ose vizë.');return}
    if(!pw){toast('warning','Shkruaj fjalëkalimin aktual për konfirmim.');return}
    const changed = un!==ME.username;
    try{const r=await rpc('mg_update_account',{p_token:TOKEN,p_first:fn,p_last:ln,p_username:un,p_password:pw});
      if(r&&r.error)throw{error:r.error};
      ME=Object.assign({},ME,r.user||{});
      await pull();
      toast('success', changed?('U ruajt. Tani hyn me: '+un):'Të dhënat u ruajtën.');
      buildChrome('admin');setActive('cilesimet');aSettings();
    }catch(err){toast('error',(err&&err.error)||'Nuk u ruajt.')}
  };
  const clr=$('#clr');if(clr)clr.onclick=async()=>{if(!await confirmModal({title:'Pastro të dhënat demo?',message:'Do të fshihen të gjithë punëtorët e orët shembull dhe do të mbetet vetëm llogaria e adminit.',danger:true,confirmText:'Po, pastro'}))return;const adminPass=DB.users.find(u=>u.username==='admin').pass;DB=seed();DB.users=DB.users.filter(u=>u.username==='admin');DB.users[0].pass=adminPass;DB.entries=[];DB.activity=[];DB.audit=[];DB.demo=false;persist();toast('success','Të dhënat u pastruan.');aSettings()};
}
function changePassword(){
  const m=openModal(`<div class="modal-head"><h3>Ndrysho fjalëkalimin</h3><p>Shkruaj fjalëkalimin aktual dhe atë të ri.</p></div><div class="modal-body"><div class="field"><label>Fjalëkalimi aktual</label><input class="input" type="password" id="c0"></div><div class="field"><label>Fjalëkalimi i ri</label><input class="input" type="password" id="c1" placeholder="Të paktën 6 karaktere"></div><div class="field"><label>Përsërit fjalëkalimin e ri</label><input class="input" type="password" id="c2"></div></div><div class="modal-foot"><button class="btn btn-ghost" data-x>Anulo</button><button class="btn btn-primary" data-ok>Ruaj</button></div>`);
  m.el('[data-x]').onclick=m.close;
  m.el('[data-ok]').onclick=async()=>{const c0=m.el('#c0').value,c1=m.el('#c1').value,c2=m.el('#c2').value;if(c1.length<6){toast('warning','Të paktën 6 karaktere.');return}if(c1!==c2){toast('warning','Fjalëkalimet nuk përputhen.');return}try{const r=await rpc('mg_change_password',{p_token:TOKEN,p_current:c0,p_next:c1});if(r&&r.error)throw{error:r.error};ME.must_change=0;toast('success','Fjalëkalimi u ndryshua.');m.close()}catch(err){toast('error',(err&&err.error)||'Gabim.')}};
}

/* ================= WORKER ================= */
function renderWorker(r){if(chromeRole!=='worker')buildChrome('worker');setActive(r);document.querySelectorAll('#mnav [data-r]').forEach(a=>a.classList.toggle('active',a.dataset.r===r));({ballina:wHome,shto:wAdd,historia:wHist,profili:wProfile}[r]||wHome)();if(ME.must_change)setTimeout(()=>forcePw(),300)}
let pwShown=false;
function forcePw(){if(pwShown)return;pwShown=true;const m=openModal(`<div class="modal-head"><h3>Vendos një fjalëkalim të ri</h3><p>Për siguri, ndrysho fjalëkalimin fillestar para se të vazhdosh.</p></div><div class="modal-body"><div class="field"><label>Fjalëkalimi aktual</label><input class="input" type="password" id="c0"></div><div class="field"><label>Fjalëkalimi i ri</label><input class="input" type="password" id="c1" placeholder="Të paktën 6 karaktere"></div><div class="field"><label>Përsërit</label><input class="input" type="password" id="c2"></div></div><div class="modal-foot"><button class="btn btn-primary" data-ok>Ruaj</button></div>`,{dismissable:false});
  m.el('[data-ok]').onclick=async()=>{const c0=m.el('#c0').value,c1=m.el('#c1').value,c2=m.el('#c2').value;if(c1.length<6){toast('warning','Të paktën 6 karaktere.');return}if(c1!==c2){toast('warning','Nuk përputhen.');return}try{const r=await rpc('mg_change_password',{p_token:TOKEN,p_current:c0,p_next:c1});if(r&&r.error)throw{error:r.error};ME.must_change=0;toast('success','Fjalëkalimi u ndryshua.');pwShown=false;m.close()}catch(err){toast('error',(err&&err.error)||'Gabim.')}};
}
function myEntries(){return DB.entries.filter(e=>e.user_id===ME.id&&!e.deleted_at).sort((a,b)=>a.work_date<b.work_date?1:a.work_date>b.work_date?-1:b.id-a.id)}
function wHome(){
  topbar('Ballina','Mirë se erdhe, '+ME.first_name,`<button class="btn btn-ghost btn-sm" id="tguide">${I.guide}<span>Si përdoret?</span></button>`);
  const all=myEntries();const today=todayISO();const[y,m]=today.split('-');const{s,e}=monthBounds(+y,+m);
  const month=all.filter(x=>inR(x,s,e));const monthMin=sumMin(month);const tEntry=all.find(x=>x.work_date===today);const last=all[0];
  const todayCard=tEntry?`<div class="card card-pad" style="border-left:4px solid var(--accent)"><span class="status-pill done">${I.check} Dita e sotme është regjistruar</span><div class="muted" style="margin-top:10px;font-size:13.5px">${tEntry.start_time} – ${tEntry.end_time} · <strong class="t-strong">${fmtMin(tEntry.total_minutes)}</strong> · ${esc(tEntry.location)}</div></div>`:`<button class="hero-action" id="hero"><div class="ha-top"><div class="ha-ic">${I.plus}</div><div><div class="ha-title">Shto ditën e punës</div><div class="ha-sub">Dita e sotme (${fmtDate(today)}) nuk është regjistruar ende</div></div></div></button>`;
  const recent=all.slice(0,5);
  setView(`<div class="grid stagger" style="max-width:760px;margin:0 auto;gap:18px">
    ${todayCard}
    <div class="stats"><div class="stat"><div class="stat-label"><span class="stat-ic">${I.clock}</span> Këtë muaj</div><div class="stat-value"><span data-count="${monthMin}" data-fmt="min">0</span></div></div>
    <div class="stat"><div class="stat-label"><span class="stat-ic">${I.cal}</span> Ditë pune</div><div class="stat-value" data-count="${month.length}" data-fmt="num">0</div></div>
    <div class="stat"><div class="stat-label"><span class="stat-ic">${I.history}</span> Orari i fundit</div><div class="stat-value" style="font-size:20px">${last?last.start_time+' – '+last.end_time:'—'}</div>${last?`<div class="stat-foot">${fmtDate(last.work_date)}</div>`:''}</div></div>
    <div class="card"><div class="card-head"><h3>Ditët e fundit</h3></div><div class="card-pad" style="padding-top:4px">${recent.length?recent.map(r=>`<div class="feed-item"><div class="feed-ic">${I.cal}</div><div class="feed-main"><div class="feed-name">${fmtDate(r.work_date)} · ${weekday(r.work_date)}</div><div class="feed-act">${r.start_time} – ${r.end_time} · ${esc(r.location)}</div><div class="muted" style="font-size:12.5px;margin-top:2px">${esc(r.description)}</div></div><div class="feed-time">${fmtMin(r.total_minutes)}</div></div>`).join(''):`<div class="empty">${I.cal}<h4>Nuk ka ende ditë pune</h4><p>Kur të regjistrosh një ditë, do të shfaqet këtu.</p></div>`}</div></div></div>`);
  const h=$('#hero');if(h)h.onclick=()=>location.hash='#/shto';
}
function wAdd(){
  topbar('Shto ditën e punës',null,`<button class="btn btn-ghost btn-sm" id="tguide">${I.guide}<span>Si përdoret?</span></button>`);
  const today=todayISO();
  setView(`<div style="max-width:560px;margin:0 auto"><div class="card card-pad"><form id="wf">
    <div class="field"><label>Data</label><input class="input" type="date" id="d" value="${today}" max="${today}"></div>
    <div class="row"><div class="field"><label>Ora e fillimit</label><input class="input" type="time" id="s" value="07:30"></div><div class="field"><label>Ora e përfundimit</label><input class="input" type="time" id="en" value="16:00"></div></div>
    <div class="field"><label>Pauza</label><select class="input" id="b"><option value="0">Pa pauzë</option><option value="15">15 minuta</option><option value="30" selected>30 minuta</option><option value="45">45 minuta</option><option value="60">1 orë</option><option value="90">1 orë 30 min</option></select></div>
    <div class="calc-box" id="calc" style="margin-bottom:15px"><span class="lbl">Total i llogaritur</span><span class="val" id="cv">—</span></div>
    <div class="field"><label>Lokacioni · Ku ke punuar?</label><input class="input" id="l" placeholder="p.sh. Berlin, Baustelle Müllerstraße"></div>
    <div class="field"><label>Çfarë ke punuar?</label><textarea class="input" id="ds" placeholder="Shkruaj shkurt çfarë ke punuar sot..."></textarea></div>
    <button class="btn btn-primary btn-lg btn-block" id="save" type="submit">${I.check} Ruaj ditën e punës</button>
  </form></div></div>`);
  const recalc=()=>{const l=calcMin($('#s').value,$('#en').value,+$('#b').value);const cv=$('#cv');cv.textContent=l==null?'—':fmtMin(l);const box=$('#calc');box.classList.add('bump');setTimeout(()=>box.classList.remove('bump'),200)};
  ['s','en','b'].forEach(id=>$('#'+id).addEventListener('input',recalc));recalc();
  $('#wf').onsubmit=async e=>{e.preventDefault();const d=$('#d').value,s=$('#s').value,en=$('#en').value,b=+$('#b').value||0,l=$('#l').value.trim(),ds=$('#ds').value.trim();
    if(!isDate(d)){toast('warning','Zgjidh datën.');return}if(d>today){toast('warning','Nuk mund të regjistrosh një datë në të ardhmen.');return}
    const tot=calcMin(s,en,b);if(tot==null||tot<=0){toast('warning','Ora e përfundimit duhet të jetë pas fillimit.');return}
    if(!l){toast('warning','Shkruaj lokacionin ku ke punuar.');return}if(!ds){toast('warning','Shkruaj shkurt çfarë ke punuar.');return}
    if(DB.entries.some(x=>x.user_id===ME.id&&x.work_date===d&&!x.deleted_at)){toast('error','Kjo ditë është regjistruar tashmë.');return}
    const btn=$('#save');btn.disabled=true;btn.innerHTML='<span class="spinner"></span>';
    const payload={p_token:TOKEN,p_date:d,p_start:s,p_end:en,p_break:b,p_location:l,p_desc:ds};
    try{ const r=await rpc('mg_add_entry',payload); if(r&&r.error)throw{error:r.error}; await pull(); successAnim(fmtMin(tot)); }
    catch(err){ if(err&&err.network){ queueOffline({rpc:payload,p_date:d,p_start:s,p_end:en,p_break:b,p_location:l,p_desc:ds,tot}); successAnim(fmtMin(tot),true); } else { btn.disabled=false;btn.innerHTML=`${I.check} Ruaj ditën e punës`; toast('error',(err&&err.error)||'Nuk u ruajt. Provo përsëri.'); } }
  };
}
function successAnim(label,pending){
  const sub=pending?`<strong style="color:var(--warn)">Ruajtur në pajisje</strong> — do të sinkronizohet automatikisht kur të kesh internet.`:`Gjithsej <strong style="color:var(--accent-ink)">${label}</strong> u shtuan në orarin tënd.`;
  const m=openModal(`<div style="padding:34px 24px;text-align:center"><svg class="check-svg" viewBox="0 0 60 60"><circle cx="30" cy="30" r="26"/><path d="M18 31l8 8 16-18"/></svg><h3 style="margin-top:14px">${pending?'Dita u ruajt':'Dita u ruajt me sukses'}</h3><p class="muted" style="margin:6px 0 0">${sub}</p><button class="btn btn-primary btn-block" data-x style="margin-top:20px">Në rregull</button></div>`,{dismissable:false});
  const go=()=>{m.close();location.hash='#/ballina';render()};m.el('[data-x]').onclick=go;setTimeout(go,2200);
}
function wHist(){
  topbar('Historia ime');
  const ranges=[['all','Të gjitha'],['today','Sot'],['week','Këtë javë'],['month','Këtë muaj'],['lastmonth','Muajin e kaluar']];
  setView(`<div style="max-width:840px;margin:0 auto"><div class="toolbar"><select class="input" id="rg">${ranges.map(r=>`<option value="${r[0]}">${r[1]}</option>`).join('')}</select><div class="spacer"></div><div class="muted" id="sum" style="font-size:13.5px"></div></div><div class="card"><table class="tbl"><tbody id="rows"></tbody></table></div></div>`);
  function draw(){
    const rg=$('#rg').value;let rows=myEntries();const today=todayISO();
    if(rg==='today')rows=rows.filter(e=>e.work_date===today);
    else if(rg==='month'){const[y,m]=today.split('-');const{s,e}=monthBounds(+y,+m);rows=rows.filter(x=>inR(x,s,e))}
    else if(rg==='week'){const d=new Date(today+'T00:00:00');const day=(d.getDay()+6)%7;const mon=new Date(d);mon.setDate(d.getDate()-day);const from=`${mon.getFullYear()}-${pad(mon.getMonth()+1)}-${pad(mon.getDate())}`;rows=rows.filter(e=>e.work_date>=from)}
    else if(rg==='lastmonth'){const[y,m]=today.split('-');const pm=new Date(+y,+m-2,1);const{s,e}=monthBounds(pm.getFullYear(),pm.getMonth()+1);rows=rows.filter(x=>inR(x,s,e))}
    $('#sum').innerHTML=`Total: <strong class="t-strong">${fmtMin(sumMin(rows))}</strong> · ${rows.length} ditë`;
    $('#rows').innerHTML=rows.length?rows.map(r=>`<tr><td style="width:100%"><div class="t-strong">${fmtDate(r.work_date)} · <span class="muted" style="font-weight:500">${weekday(r.work_date)}</span></div><div class="muted" style="font-size:13px;margin-top:2px">${r.start_time} – ${r.end_time}${r.break_minutes?` · pauzë ${r.break_minutes}min`:''} · ${esc(r.location)}</div><div class="muted" style="font-size:12.5px;margin-top:3px">${esc(r.description)}</div></td><td class="num nowrap"><span class="badge badge-active"><span class="badge-dot"></span>${fmtMin(r.total_minutes)}</span></td></tr>`).join(''):`<tr><td><div class="empty">${I.history}<h4>Nuk ka ditë pune</h4><p>Për këtë periudhë s'ka regjistrime.</p></div></td></tr>`;
  }
  $('#rg').onchange=draw;draw();
}
function wProfile(){
  topbar('Profili im');
  const all=myEntries();const today=todayISO();const[y,m]=today.split('-');const{s,e}=monthBounds(+y,+m);
  setView(`<div style="max-width:560px;margin:0 auto" class="grid"><div class="card card-pad"><div class="flex gap12" style="align-items:center;margin-bottom:18px"><div class="avatar" style="width:56px;height:56px;font-size:20px">${initials(ME.first_name,ME.last_name)}</div><div><h3 style="font-size:19px">${esc(ME.first_name)} ${esc(ME.last_name)}</h3><div class="muted">@${esc(ME.username)} · <span class="badge badge-active"><span class="badge-dot"></span>Aktiv</span></div></div></div><dl class="dl"><div><dt>Orët këtë muaj</dt><dd>${fmtMin(sumMin(all.filter(x=>inR(x,s,e))))}</dd></div><div><dt>Ditë pune (ky muaj)</dt><dd>${all.filter(x=>inR(x,s,e)).length}</dd></div></dl></div>
    <div class="card card-pad"><h3 style="font-size:15px;margin-bottom:4px">Siguria</h3><p class="muted" style="font-size:13.5px;margin:0 0 14px">Ndrysho fjalëkalimin tënd kur të duash.</p><button class="btn btn-ghost" id="cpw">${I.key} Ndrysho fjalëkalimin</button></div>
    ${installCardHtml()}
    <div class="card card-pad"><button class="btn btn-ghost btn-block" id="wlogout">${I.logout} Dil nga llogaria</button></div></div>`);
  $('#cpw').onclick=changePassword;wireInstall();$('#wlogout').onclick=logout;
}
function guide(){
  const steps=ME&&ME.role==='admin'?[['1','Shto punëtorët','Te "Punëtorët" → "Shto punëtor". Sistemi krijon username-in dhe një fjalëkalim fillestar.'],['2','Punëtorët regjistrojnë orët','Ata hyjnë me llogarinë e tyre dhe shtojnë ditët e punës nga telefoni.'],['3','Ti kontrollon gjithçka','Shiko orët, filtro sipas punëtorit/muajit, korrigjo ose fshi kur duhet.'],['4','Gjenero raporte','Te "Raportet" krijon raporte, i printon ose i eksporton.']]
    :[['1','Zgjidh datën','Zgjidh ditën kur ke punuar. Zakonisht është sot.'],['2','Shëno orët','Vendos orën e fillimit dhe të përfundimit — orët llogariten vetë.'],['3','Shëno lokacionin','Shkruaj ku ke punuar. <span class="guide-eg">Berlin – Baustelle Müllerstraße</span>'],['4','Shkruaj çfarë ke bërë','<span class="guide-eg">Punë me fasadë dhe izolim.</span>'],['5','Kliko "Ruaj ditën e punës"','Kaq! Dita jote u regjistrua.']];
  const m=openModal(`<div class="modal-head"><h3>Udhëzuesi</h3><p>Si funksionon sistemi.</p></div><div class="modal-body">${steps.map(s=>`<div class="guide-step"><div class="guide-num">${s[0]}</div><div><h4>${s[1]}</h4><p>${s[2]}</p></div></div>`).join('')}</div><div class="modal-foot"><button class="btn btn-primary" data-x>E kuptova</button></div>`);
  m.el('[data-x]').onclick=m.close;
}

/* ---------------- Router + boot ---------------- */
function render(){
  if(!ME){renderLogin();return}
  const r=(location.hash.replace(/^#\//,'')||(ME.role==='admin'?'dashboard':'ballina')).split('?')[0];
  if(ME.role==='admin'){ startPoll(); renderAdmin(r); } else { stopPoll(); renderWorker(r); }
}
window.addEventListener('hashchange',render);

async function boot(){
  const hasToken=restore();
  if(!hasToken){ renderLogin(); return; }
  // Shfaq menjëherë nga cache (offline-first), pastaj rifresko nga cloud.
  if(ME){ render(); }
  try{ await pull(); render(); flushOutbox(); }
  catch(e){ if(e&&e.error==='auth'){ renderLogin(); } else if(!ME){ renderLogin(); } }
}
// Service worker (PWA) — vetëm kur shërbehet nga hosting (jo file://)
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').then(reg=>{
    reg.addEventListener('updatefound',()=>{const nw=reg.installing;if(!nw)return;
      nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller){
        toast('info','Version i ri i aplikacionit është gati — rifresko faqen.');}})});
  }).catch(()=>{})});
}
boot();
</script>
